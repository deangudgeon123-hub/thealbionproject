<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Albion Project - Independent Policy Analysis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              serif: ['Merriweather', 'serif'],
            },
            colors: {
              albion: {
                blue: '#00247D', // Union Jack Blue
                red: '#CF142B',   // Union Jack Red (muted)
                navy: '#0f172a',  // Deep Slate
                light: '#f8fafc', // Off white
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f5f9;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }

      /* Subtle Union Jack Geometry Pattern */
      .bg-union-jack {
        background-color: #f8fafc;
        background-image: 
          linear-gradient(45deg, rgba(0, 36, 125, 0.03) 25%, transparent 25%, transparent 75%, rgba(0, 36, 125, 0.03) 75%, rgba(0, 36, 125, 0.03)),
          linear-gradient(-45deg, rgba(207, 20, 43, 0.02) 25%, transparent 25%, transparent 75%, rgba(207, 20, 43, 0.02) 75%, rgba(207, 20, 43, 0.02));
        background-size: 60px 60px;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/"
  }
}
</script>
</head>
  <body class="bg-union-jack text-slate-800 antialiased selection:bg-albion-blue selection:text-white">
    <div id="root"></div>
  </body>
</html>
